[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toli"
version = "0.1.0"
description = "Toli — typed decisions with a calibrated confidence, and the three-route rule that keeps a human in the loop."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Essabu", email = "dev@essabu.com" }]
keywords = ["toli", "essabu", "classification", "decision", "confidence", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://toli.essabu.com"
Source = "https://github.com/essabu/toli-python"

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.13", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/toli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src/toli"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
